<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <rect width="1100" height="680" fill="#f7f7f5"/>
  <text x="550" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111">Diagram C  System architecture (leeacoins-org v1)</text>
  <text x="550" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Vite React client + Express API + SQLite ledger � off-chain redemption</text>

  <!-- User -->
  <rect x="40" y="120" width="160" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="120" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">User / browser</text>
  <text x="120" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">Hero � Basket</text>
  <text x="120" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">Exchange � Wallet</text>

  <line x1="200" y1="160" x2="280" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Client -->
  <rect x="280" y="100" width="220" height="120" rx="8" fill="#1a1a1a"/>
  <text x="390" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">React client (Vite)</text>
  <text x="390" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">shared/leea-units.ts</text>
  <text x="390" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ccc">session cookie API calls</text>

  <line x1="500" y1="160" x2="580" y2="160" stroke="#333" stroke-width="2"/>
  <text x="540" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">HTTPS / JSON</text>

  <!-- Server -->
  <rect x="580" y="80" width="260" height="160" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="710" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111">Express API</text>
  <text x="710" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">/api/auth � /api/wallet</text>
  <text x="710" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">/api/leea/basket � options</text>
  <text x="710" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">/api/redeem � quote</text>
  <text x="710" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">/api/admin/redemptions</text>

  <line x1="710" y1="240" x2="710" y2="300" stroke="#333" stroke-width="2"/>

  <!-- DB -->
  <rect x="580" y="300" width="260" height="140" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="710" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111">SQLite ledger</text>
  <text x="710" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">users � sessions � wallets</text>
  <text x="710" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">ledger_entries (append-only)</text>
  <text x="710" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">redemption_requests</text>
  <text x="710" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">data/leea.sqlite</text>

  <!-- Shared module callout -->
  <rect x="40" y="300" width="460" height="140" rx="8" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="270" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Canonical economics module</text>
  <text x="60" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">shared/leea-units.ts</text>
  <text x="60" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">BASKET[]    Diagram A (definition)</text>
  <text x="60" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">REDEMPTION_OPTIONS[]    Diagram B (OR menu)</text>

  <!-- Out of scope box -->
  <rect x="40" y="480" width="1020" height="160" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309">Out of scope for v1 (explicit non-goals)</text>
  <text x="70" y="550" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">" No Solana / Phantom / on-chain mint-burn</text>
  <text x="70" y="575" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">" No physical warehouse / logistics partner integration (admin status only: pending � fulfilled | rejected)</text>
  <text x="70" y="600" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">" No USD peg / FX oracle � No PeaceChainAI ledger sync � No changes to peaceism-ai-agent-mvp phases</text>
  <text x="70" y="625" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">" $PCSM crypto narrative retained in About/Tokenomics only; LEEA is the redeemable commodity unit</text>
</svg>
